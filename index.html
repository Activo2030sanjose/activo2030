<!doctype html>
<html lang="es-CR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000a47">
<title>Portal Activo 20-30 San José</title>
<style id="antiframe">html{display:none!important}</style>
<script>
(function(){
  var enMarco=false;try{enMarco=window.top!==window.self}catch(e){enMarco=true}
  if(!enMarco){var s=document.getElementById('antiframe');s.parentNode.removeChild(s);return}
  try{window.top.location.href=window.self.location.href}catch(e){}
  document.addEventListener('DOMContentLoaded',function(){
    document.body.innerHTML='<p style="font:16px Arial,sans-serif;padding:24px">Por seguridad, esta página solo se puede abrir directamente en el navegador.</p>';
    var s=document.getElementById('antiframe');if(s)s.parentNode.removeChild(s);
  });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,900&display=swap">
<style>
:root{--azul:#001489;--noche:#000a47;--rojo:#da291c;--amarillo:#fedd00;--fg:#0d1238;--muted:#5a6080;--line:#dfe2ef;--surface:#fff;--surface-2:#eef0f8;
  --f:"Lato","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--f);color:#fff;background:radial-gradient(120% 140% at 85% -10%,var(--azul) 0%,var(--noche) 70%);min-height:100vh;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.saw{position:fixed;width:min(720px,120vw);height:min(720px,120vw);right:-18vw;top:-22vw;opacity:.16;pointer-events:none}
.saw img{width:100%;height:100%;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{position:relative;flex:1;width:100%;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:clamp(24px,4vw,40px);
  padding-block:clamp(28px,6vw,64px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:clamp(14px,2.5vw,22px)}
header img{width:clamp(72px,12vw,104px);height:auto;flex:none;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))}
.eyebrow{font-size:.75rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--amarillo)}
h1{font-weight:900;font-size:clamp(1.9rem,5vw,3.2rem);line-height:1.05;margin:6px 0 0;text-wrap:balance}
h1 em{font-style:italic;color:var(--amarillo)}
.lead{font-size:1.0625rem;font-weight:300;opacity:.86;margin:0;max-width:48ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2.5vw,22px)}
.opt{position:relative;display:flex;flex-direction:column;gap:14px;background:var(--surface);color:var(--fg);border-radius:22px;padding:clamp(22px,3.5vw,32px);
  text-decoration:none;box-shadow:0 24px 60px -24px rgba(0,0,0,.55);transition:transform .2s,box-shadow .2s;min-width:0;border:2px solid transparent}
.opt:hover{transform:translateY(-3px);box-shadow:0 30px 70px -24px rgba(0,0,0,.65)}
.opt:focus-visible{outline:3px solid var(--amarillo);outline-offset:3px}
.ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center}
.ico.r{background:var(--rojo);color:#fff}.ico.y{background:var(--amarillo);color:var(--noche)}
.opt h2{font-size:1.6rem;font-weight:900;margin:0}
.opt p{margin:0;color:var(--muted);line-height:1.55}
.opt ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.opt li{font-size:.8125rem;font-weight:700;background:var(--surface-2);border-radius:999px;padding:4px 10px}
.go{margin-top:auto;display:inline-flex;align-items:center;gap:10px;align-self:flex-start;font-weight:900;border-radius:999px;padding:.8rem 1.4rem}
.opt.socios .go{background:var(--rojo);color:#fff}
.opt.colab .go{background:var(--azul);color:#fff}
.stripe{position:relative;display:flex;height:6px}.stripe i{flex:1}.stripe i:nth-child(1){background:var(--amarillo)}.stripe i:nth-child(2){background:var(--rojo);flex:1.5}.stripe i:nth-child(3){background:var(--azul);flex:2.5}
footer{position:relative;background:var(--surface);color:var(--muted);font-size:.8125rem}
footer div{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:700px){.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="dots" aria-hidden="true"></canvas>
<div class="saw" aria-hidden="true"><img src="img/sierra.png" alt=""></div>
<main>
  <header>
    <img src="img/logo-color.png" alt="Activo 20-30 Internacional San José #532">
    <div>
      <span class="eyebrow">Club Activo 20-30 San José #532</span>
      <h1>Bienvenido al <em>portal del club</em></h1>
    </div>
  </header>
  <p class="lead">Elegí cómo querés ingresar.</p>
  <nav class="opts" aria-label="Tipo de ingreso">
    <a class="opt socios" href="socios/">
      <span class="ico r"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
      <h2>Socios</h2>
      <span class="go">Ingresar como socio <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span>
    </a>
    <a class="opt colab" href="colaboradores/">
      <span class="ico y"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.8"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M15 14.2c3.3-.3 6.5 1.7 6.5 5.3"/></svg></span>
      <h2>Colaboradores</h2>
      <span class="go">Ingresar como colaborador <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span>
    </a>
  </nav>
</main>
<div class="stripe"><i></i><i></i><i></i></div>
<footer><div><span>© 2026 Club Activo 20-30 Internacional de San José #532</span><span>«La juventud para ser servida debe servir»</span></div></footer>
<script>

(function(){var c=document.getElementById('dots'),x=c.getContext('2d'),w,h,still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){var dp=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dp;c.height=h*dp;x.setTransform(dp,0,0,dp,0,0)}
  function draw(t){x.clearRect(0,0,w,h);var g=20,tt=t/1000;
    for(var yy=g/2;yy<h;yy+=g)for(var xx=g/2;xx<w;xx+=g){var s=Math.max(0,1-Math.hypot(xx/w-.92,(yy/h+.1)*.9)*1.25);if(s<=0)continue;
      s*=.75+.25*Math.sin(tt*1.1+xx*.035+yy*.02);var rr=s*4.2;if(rr<.35)continue;var hs=(Math.sin(xx*12.9898+yy*78.233)*43758.5453)%1;
      x.fillStyle=hs>.9?'rgba(254,221,0,.9)':hs<-.94?'rgba(218,41,28,.85)':'rgba(255,255,255,'+(.12+s*.25)+')';x.beginPath();x.arc(xx,yy,rr,0,6.283);x.fill()}}
  size();addEventListener('resize',function(){size();draw(performance.now())});
  (function loop(t){draw(t||0);if(!still)requestAnimationFrame(loop)})();})();
</script>
</body>
</html>
